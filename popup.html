<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .toggle-label { font-size: 13px; }
    .switch {
      position: relative;
      width: 42px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider { background: #6c63ff; }
    .switch input:checked + .slider::before { transform: translateX(20px); }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
    }
    .theme-options {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .theme-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #333;
      border-radius: 6px;
      background: #252540;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .theme-btn:hover { border-color: #6c63ff; color: #fff; }
    .theme-btn.active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }
    .whitelist-btn {
      width: 100%;
      padding: 7px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #252540;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .whitelist-btn:hover { border-color: #6c63ff; color: #fff; }
    .whitelist-btn.whitelisted {
      background: #3a2a2a;
      border-color: #ff6b6b;
      color: #ff6b6b;
    }
    .auto-row {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Dark Mode</h2>

  <div class="toggle-row">
    <span class="toggle-label">Enable</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-label">Theme</div>
  <div class="theme-options">
    <button class="theme-btn" data-theme="dark">Dark</button>
    <button class="theme-btn" data-theme="dim">Dim</button>
    <button class="theme-btn" data-theme="custom">Custom</button>
  </div>

  <button class="whitelist-btn" id="whitelistBtn">Whitelist this site</button>

  <script src="popup.js"></script>
</body>
</html>
